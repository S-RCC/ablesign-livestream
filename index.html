<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Livestream</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: none;
  }
  #stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #stage iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
(function () {
  /* ===================== SETTINGS ===================== */

  // Which source to show. Choose one:
  //   'subsplash-schedule' : Subsplash, shown only during the time windows below
  //   'subsplash-always'   : Subsplash, always shown (Subsplash decides what to display)
  //   'youtube-api'        : YouTube channel, shown only while it is really live
  var MODE = 'subsplash-schedule';

  // --- Subsplash ---
  var SUBSPLASH_URL = 'https://subsplash.com/u/regencc/media/embed/d/*next-live' +
    '?info=0&logoWatermark=0&shareable=0';

  // Time windows when the stream is expected, using the screen's local clock.
  // day: 0 = Sunday ... 6 = Saturday.  Times are 24-hour "HH:MM".
  // Start a little before the service and end a little after.
  var SCHEDULE = [
    { day: 0, start: '08:30', end: '12:30' },
    { day: 3, start: '18:30', end: '20:30' }
  ];

  // --- YouTube (only used when MODE is 'youtube-api') ---
  var YT_CHANNEL_ID = 'UCSeke8Wzhy4Igup1LJa6bkQ';
  var YT_API_KEY = 'PASTE_YOUR_YOUTUBE_DATA_API_KEY_HERE';
  // Each check costs 100 of the 10,000 free daily quota units.
  // 15 minutes = about 96 checks a day, which stays inside the free quota.
  var YT_CHECK_MINUTES = 15;

  /* ==================================================== */

  var stage = document.getElementById('stage');
  var frame = null;
  var currentSrc = '';

  function show(src) {
    if (src === currentSrc) { return; }   // already showing it: do nothing
    clear();
    frame = document.createElement('iframe');
    frame.setAttribute('frameborder', '0');
    frame.setAttribute('scrolling', 'no');
    frame.setAttribute('allowfullscreen', '');
    frame.setAttribute('webkitallowfullscreen', '');
    frame.setAttribute('mozallowfullscreen', '');
    frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; clipboard-read; clipboard-write');
    frame.setAttribute('title', 'Livestream');
    frame.src = src;
    stage.appendChild(frame);
    currentSrc = src;
  }

  function clear() {
    if (frame && frame.parentNode) {
      frame.parentNode.removeChild(frame);
    }
    frame = null;
    currentSrc = '';
  }

  /* ---------- Subsplash ---------- */

  function toMinutes(hhmm) {
    var p = hhmm.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  function inSchedule() {
    var now = new Date();
    var day = now.getDay();
    var mins = now.getHours() * 60 + now.getMinutes();
    var i, w;
    for (i = 0; i < SCHEDULE.length; i++) {
      w = SCHEDULE[i];
      if (w.day === day && mins >= toMinutes(w.start) && mins < toMinutes(w.end)) {
        return true;
      }
    }
    return false;
  }

  function checkSchedule() {
    if (inSchedule()) { show(SUBSPLASH_URL); } else { clear(); }
  }

  /* ---------- YouTube ---------- */

  function checkYouTube() {
    var url = 'https://www.googleapis.com/youtube/v3/search' +
      '?part=id&type=video&eventType=live&maxResults=1' +
      '&channelId=' + encodeURIComponent(YT_CHANNEL_ID) +
      '&key=' + encodeURIComponent(YT_API_KEY);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.onreadystatechange = function () {
      var data, id;
      if (xhr.readyState !== 4) { return; }
      if (xhr.status !== 200) { return; }   // on error keep whatever is showing
      try {
        data = JSON.parse(xhr.responseText);
      } catch (e) {
        return;
      }
      id = data && data.items && data.items.length && data.items[0].id
        ? data.items[0].id.videoId : '';
      if (id) {
        show('https://www.youtube.com/embed/' + encodeURIComponent(id) +
          '?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&modestbranding=1');
      } else {
        clear();
      }
    };
    xhr.send();
  }

  /* ---------- Start ---------- */

  if (MODE === 'subsplash-always') {
    show(SUBSPLASH_URL);
  } else if (MODE === 'youtube-api') {
    checkYouTube();
    window.setInterval(checkYouTube, YT_CHECK_MINUTES * 60 * 1000);
  } else {
    checkSchedule();
    window.setInterval(checkSchedule, 30 * 1000);
  }
})();
</script>
</body>
</html>
